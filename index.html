<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tasbih App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef2f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        #appContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #eef2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
            padding: 20px;
        }
        /* Dropdown Selectors Area */
        .selector-box {
            background: #d4e0ec;
            width: 90%;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 10px;
        }
        .selector-box select {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            width: 100%;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            text-align: center;
            font-family: 'Traditional Arabic', Arial, sans-serif;
        }
        .arabic-sub {
            font-size: 18px;
            color: #1e293b;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            padding: 0 15px;
            font-family: 'Traditional Arabic', Arial, sans-serif;
        }
        /* Top Action Icons Bar */
        .action-bar {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }
        .icon-btn {
            background: #e2e8f0;
            border: 2px solid #cbd5e1;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: 0.1s;
        }
        .icon-btn:active {
            transform: scale(0.92);
            background: #cbd5e1;
        }
        /* Main Counter Circle Area */
        .counter-section {
            position: relative;
            margin-top: 25px;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .ring-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4));
        }
        .ring-bg {
            fill: none;
            stroke: #d0dbe7;
            stroke-width: 12;
        }
        .ring-progress {
            fill: none;
            stroke: url(#blueGradient);
            stroke-width: 14;
            stroke-dasharray: 722;
            stroke-dashoffset: 722;
            transition: stroke-dashoffset 0.25s ease;
            stroke-linecap: round;
        }
        .counter-display {
            z-index: 2;
            font-size: 60px;
            font-weight: bold;
            color: #1e293b;
        }
        /* Total Box (Sorbomoto) */
        .total-container {
            position: absolute;
            bottom: 60px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .total-circle {
            width: 55px;
            height: 55px;
            border: 3px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #334155;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .total-box-label {
            margin-top: 5px;
            background: #fff;
            padding: 3px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #475569;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="appContainer">
        <!-- Pure Arabic Zikr Dropdown & Target Dropdown -->
        <div class="selector-box">
            <!-- Pure Arabic Zikr Dropdown -->
            <select id="zikrSelect" onchange="updateZikrText()">
                <option value="أَسْتَغْفِرُ اللَّهَ">أَسْتَغْفِرُ اللَّهَ</option>
                <option value="سُبْحَانَ اللَّهِ">سُبْحَانَ اللَّهِ</option>
                <option value="اللَّهُ أَكْبَرُ">اللَّهُ أَكْبَرُ</option>
                <option value="لَا إِلَهَ إِلَّا اللَّهُ">لَا إِلَهَ إِلَّا اللَّهُ</option>
                <option value="لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ">لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ</option>
                <option value="حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ">حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ</option>
                <option value="صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ</option>
                <option value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ</option>
                <option value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</option>
                <option value="لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ</option>
                <option value="اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ</option>
            </select>

            <!-- Target Count Dropdown -->
            <select id="targetSelect" onchange="changeTarget()">
                <option value="11">Target: 11</option>
                <option value="33">Target: 33</option>
                <option value="100" selected>Target: 100</option>
                <option value="custom">Custom Target</option>
            </select>
        </div>

        <div class="arabic-sub" id="zikrMeaning">أَسْتَغْفِرُ اللَّهَ</div>

        <!-- Action Icons (Settings, Reset, Sound) -->
        <div class="action-bar">
            <div class="icon-btn" onclick="openSettings()" title="Settings">⚙️</div>
            <div class="icon-btn" onclick="resetCounter()" title="Reset">🔄</div>
            <div class="icon-btn" onclick="toggleSound()" title="Sound">🔊</div>
        </div>

        <!-- Main Clickable Ring Counter -->
        <div class="counter-section" onclick="incrementCount()">
            <svg class="ring-svg" viewBox="0 0 250 250">
                <defs>
                    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#60a5fa" />
                        <stop offset="50%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#1d4ed8" />
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="125" cy="125" r="110"></circle>
                <circle id="progressRing" class="ring-progress" cx="125" cy="125" r="110"></circle>
            </svg>
            <div class="counter-display" id="currentCount">0</div>
        </div>

        <!-- Sorbomoto (Total Counter) Box -->
        <div class="total-container">
            <div class="total-circle" id="totalCountDisplay">0</div>
            <div class="total-box-label">সর্বমোট: <span id="totalTextNum">0</span></div>
        </div>
    </div>

    <script>
        let currentCount = 0;
        let totalCount = 0;
        let targetLimit = 100;
        let soundEnabled = true;

        const currentCountElem = document.getElementById('currentCount');
        const totalCountDisplay = document.getElementById('totalCountDisplay');
        const totalTextNum = document.getElementById('totalTextNum');
        const progressRing = document.getElementById('progressRing');
        const targetSelect = document.getElementById('targetSelect');
        const zikrSelect = document.getElementById('zikrSelect');
        const zikrMeaning = document.getElementById('zikrMeaning');

        const radius = 110;
        const circumference = 2 * Math.PI * radius;
        progressRing.style.strokeDasharray = circumference;

        function updateDisplay() {
            currentCountElem.innerText = currentCount;
            totalCountDisplay.innerText = totalCount;
            totalTextNum.innerText = totalCount;

            let progress = currentCount / targetLimit;
            if (progress > 1) progress = 1;
            let offset = circumference - (progress * circumference);
            progressRing.style.strokeDashoffset = offset;
        }

        function incrementCount() {
            currentCount++;
            totalCount++;
            playSound();

            if (currentCount >= targetLimit) {
                currentCount = 0; 
            }
            updateDisplay();
        }

        function resetCounter() {
            if (confirm("Apni ki boro count ebong sorbomoto (total) duitai reset korte chan?")) {
                currentCount = 0;
                totalCount = 0;
                updateDisplay();
            }
        }

        function changeTarget() {
            let val = targetSelect.value;
            if (val === 'custom') {
                let customVal = prompt("Enter custom target number:", "50");
                if (customVal && !isNaN(customVal)) {
                    targetLimit = parseInt(customVal);
                } else {
                    targetLimit = 100;
                    targetSelect.value = "100";
                }
            } else {
                targetLimit = parseInt(val);
            }
            currentCount = 0;
            updateDisplay();
        }

        function updateZikrTextGulo() {
            zikrMeaning.innerText = zikrSelect.value;
            currentCount = 0;
            updateDisplay();
        }

        function updateZikrText() {
            updateZikrTextGulo();
        }

        function playSound() {
            if (!soundEnabled) return;
            if (navigator.vibrate) {
                navigator.vibrate(40);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            alert(soundEnabled ? "Sound & Vibration Enabled" : "Sound & Vibration Disabled");
        }

        function openSettings() {
            let action = prompt("Type 'resetall' to clear counts.");
            if (action === 'resetall') {
                totalCount = 0;
                currentCount = 0;
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
