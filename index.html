<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Liquid Glass App</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent !important;
            user-select: none !important;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #090d16 60%, #020408 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }
        #appContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
                        inset 0 0 30px rgba(255, 255, 255, 0.08);
            padding: 20px;
            overflow-y: auto;
        }
        #appContainer::-webkit-scrollbar {
            width: 4px;
        }
        #appContainer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Screen Management */
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            min-height: 100%;
        }
        .screen.active {
            display: flex;
        }

        /* Header / Navbar */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 14px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }
        .back-btn:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* iOS 26 Liquid Glass Cards Style (Matching Figma Reference) */
        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            margin-bottom: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4), 
                        inset 0 1px 2px rgba(255,255,255,0.4),
                        inset 0 -2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .glass-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.15);
        }

        /* Dropdowns for Tasbih (Matching Screenshot 1 style) */
        .tasbih-dropdown-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            padding: 12px 16px;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }
        .tasbih-dropdown-box select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            width: 75%;
            text-align: right;
        }
        .tasbih-dropdown-box select option {
            background: #0f172a;
            color: #fff;
        }

        /* Tasbih Ring Counter UI */
        .counter-display {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 52px;
            font-weight: 700;
            margin: 20px 0;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 
                        inset 0 2px 6px rgba(255,255,255,0.4),
                        inset 0 -5px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .counter-display:active {
            transform: scale(0.95);
        }

        .tasbih-tools {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            align-items: center;
        }
        .tool-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 16px;
            border-radius: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
        }
        .tool-btn.active-glow {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(96, 165, 250, 0.6);
        }

        /* Prayer Tracker Table */
        .prayer-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .prayer-table th, .prayer-table td {
            padding: 10px 4px;
            text-align: center;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .prayer-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* Action Buttons */
        .action-btn {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.1));
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
        }

        /* Content Box for Dua & Deeds */
        .content-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            width: 100%;
            text-align: left;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.25);
        }
        .arabic-text {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
            text-align: right;
        }
        .english-meaning {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 4px;
        }
        .source-text {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
        }
    </style>
</head>
<body>

    <div id="appContainer">
        
        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="screen active">
            <div style="font-size: 24px; font-weight: 800; margin: 25px 0 20px 0; background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center;">
                YOUR TASBIH 📿
            </div>
            
            <div style="width: 100%; display: flex; flex-direction: column; gap: 4px;">
                <div class="glass-card" onclick="showScreen('prayerScreen')">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 24px;">🕌</span>
                        <div>
                            <div style="font-size: 17px; font-weight: bold;">Prayer</div>
                            <div style="font-size: 12px; color: rgba(255,255,255,0.6);">30 Day Target Tracker</div>
                        </div>
                    </div>
                    <span style="font-size: 18px; color: rgba(255,255,255,0.5);">›</span>
                </div>

                <div class="glass-card" onclick="showScreen('duaScreen')">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 24px;">🤲</span>
                        <div style="font-size: 17px; font-weight: bold;">Dua Collection</div>
                    </div>
                    <span style="font-size: 18px; color: rgba(255,255,255,0.5);">›</span>
                </div>

                <div class="glass-card" onclick="showScreen('deedsScreen')">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 24px;">❤️</span>
                        <div style="font-size: 17px; font-weight: bold;">Daily Deeds</div>
                    </div>
                    <span style="font-size: 18px; color: rgba(255,255,255,0.5);">›</span>
                </div>

                <div class="glass-card" onclick="showScreen('tasbihScreen')">
                    <div style="display: flex; align-items: center; gap: 14px;">
                        <span style="font-size: 24px;">📿</span>
                        <div style="font-size: 17px; font-weight: bold;">Tasbih Counter</div>
                    </div>
                    <span style="font-size: 18px; color: rgba(255,255,255,0.5);">›</span>
                </div>
            </div>
        </div>

        <!-- Tasbih Screen (Fully customized with dropdowns & audio/vibe toggle) -->
        <div id="tasbihScreen" class="screen">
            <div class="header" style="margin-top: 10px;">
                <button class="back-btn" onclick="showScreen('dashboardScreen')">← Back</button>
                <span>Tasbih Counter</span>
                <div></div>
            </div>

            <!-- Tasbih Selection Dropdown -->
            <div class="tasbih-dropdown-box">
                <span>Dhikr</span>
                <select id="tasbihSelect" onchange="changeTasbihText()">
                    <option value="أَسْتَغْفِرُ اللَّهَ">Astaghfirullah</option>
                    <option value="سُبْحَانَ اللَّهِ">SubhanAllah</option>
                    <option value="اللَّهُ أَكْبَرُ">Allahu Akbar</option>
                    <option value="الْحَمْدُ لِلَّهِ">Alhamdulillah</option>
                    <option value="لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ">La ilaha illa anta...</option>
                    <option value="لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ">La hawla wa la quwwata...</option>
                    <option value="حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ">Hasbunallahu wa ni'mal-wakil</option>
                    <option value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ">SubhanAllahi wa bihamdihi</option>
                    <option value="لَا إِلَٰهَ إِلَّا اللَّهُ">La ilaha illallah</option>
                    <option value="اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ">Allahumma salli 'ala Muhammad</option>
                    <option value="صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ">Sallallahu alayhi wa sallam</option>
                </select>
            </div>

            <!-- Target Selection Dropdown -->
            <div class="tasbih-dropdown-box">
                <span>Target</span>
                <select id="targetSelect" onchange="updateTarget()">
                    <option value="33">33</option>
                    <option value="100" selected>100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                    <option value="0">Unlimited</option>
                </select>
            </div>

            <!-- Active Tasbih Display Text -->
            <div id="activeTasbihLabel" style="font-size: 15px; color: #38bdf8; margin: 10px 0 5px 0; font-weight: bold; text-align: center;">أَسْتَغْفِرُ اللَّهَ</div>

            <!-- Counter Ring -->
            <div class="counter-display" id="counterVal" onclick="incrementTasbih()">0</div>

            <!-- Tools: Reset & Toggles -->
            <div class="tasbih-tools">
                <div class="tool-btn" onclick="resetTasbih()">🔄 Reset</div>
                <div class="tool-btn" id="soundBtn" onclick="toggleSound()">🔊 Sound: <span id="soundStatus">On</span></div>
                <div class="tool-btn" id="vibeBtn" onclick="toggleVibe()">📳 Vibe: <span id="vibeStatus">On</span></div>
            </div>
        </div>

        <!-- Prayer Tracker Screen (With 30 days reset option) -->
        <div id="prayerScreen" class="screen">
            <div class="header" style="margin-top: 10px;">
                <button class="back-btn" onclick="showScreen('dashboardScreen')">← Back</button>
                <span>Prayer Tracker</span>
                <div></div>
            </div>
            <div style="font-size: 19px; font-weight: bold; margin: 10px 0 5px 0; text-align: center; color: #f472b6;">PRAYER TRACKER</div>
            
            <button class="action-btn" onclick="resetPrayerTracker()">🗑️ Reset 30-Day Tracker</button>

            <div style="width: 100%; overflow-x: auto; margin-bottom: 20px;">
                <table class="prayer-table">
                    <thead>
                        <tr style="color: #38bdf8;">
                            <th>DAY</th>
                            <th>FAJR</th>
                            <th>DUHR</th>
                            <th>ASR</th>
                            <th>MAGH</th>
                            <th>ISHA</th>
                        </tr>
                    </thead>
                    <tbody id="prayerTableBody">
                        <!-- Generated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Dua Screen -->
        <div id="duaScreen" class="screen">
            <div class="header" style="margin-top: 10px;">
                <button class="back-btn" onclick="showScreen('dashboardScreen')">← Back</button>
                <span>Daily Duas</span>
                <div></div>
            </div>
            <div id="duaListContainer" style="width: 100%; overflow-y: auto; padding-bottom: 20px;">
                <!-- Filled via JS -->
            </div>
        </div>

        <!-- Daily Deeds Screen -->
        <div id="deedsScreen" class="screen">
            <div class="header" style="margin-top: 10px;">
                <button class="back-btn" onclick="showScreen('dashboardScreen')">← Back</button>
                <span>Daily Deeds</span>
                <div></div>
            </div>
            <div id="deedsContainer" style="width: 100%; overflow-y: auto; padding-bottom: 20px;">
                <!-- Filled via JS -->
            </div>
        </div>

    </div>

    <script>
        // Screen Navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Tasbih Settings & Logic
        let tasbihCount = parseInt(localStorage.getItem('tasbih_count')) || 0;
        let soundEnabled = localStorage.getItem('sound_enabled') !== 'false';
        let vibeEnabled = localStorage.getItem('vibe_enabled') !== 'false';
        let currentTarget = parseInt(localStorage.getItem('tasbih_target')) || 100;

        document.getElementById('counterVal').innerText = tasbihCount;
        document.getElementById('targetSelect').value = currentTarget;

        // Audio Beep Generator using Web Audio API (No external mp3 needed)
        function playClickSound() {
            if (!soundEnabled) return;
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function triggerFeedback() {
            playClickSound();
            if (vibeEnabled && navigator.vibrate) {
                navigator.vibrate(35);
            }
        }

        function incrementTasbih() {
            tasbihCount++;
            if (currentTarget > 0 && tasbihCount > currentTarget) {
                tasbihCount = 1; // Loop back or reset
            }
            document.getElementById('counterVal').innerText = tasbihCount;
            localStorage.setItem('tasbih_count', tasbihCount);
            triggerFeedback();
        }

        function resetTasbih() {
            tasbihCount = 0;
            document.getElementById('counterVal').innerText = tasbihCount;
            localStorage.setItem('tasbih_count', tasbihCount);
        }

        function changeTasbihText() {
            let select = document.getElementById('tasbihSelect');
            document.getElementById('activeTasbihLabel').innerText = select.value;
        }

        function updateTarget() {
            currentTarget = parseInt(document.getElementById('targetSelect').value);
            localStorage.setItem('tasbih_target', currentTarget);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('sound_enabled', soundEnabled);
            document.getElementById('soundStatus').innerText = soundEnabled ? 'On' : 'Off';
            document.getElementById('soundBtn').classList.toggle('active-glow', soundEnabled);
        }

        function toggleVibe() {
            vibeEnabled = !vibeEnabled;
            localStorage.setItem('vibe_enabled', vibeEnabled);
            document.getElementById('vibeStatus').innerText = vibeEnabled ? 'On' : 'Off';
            document.getElementById('vibeBtn').classList.toggle('active-glow', vibeEnabled);
        }

        // Initialize Toggles UI
        if(soundEnabled) document.getElementById('soundBtn').classList.add('active-glow');
        if(vibeEnabled) document.getElementById('vibeBtn').classList.add('active-glow');
        document.getElementById('soundStatus').innerText = soundEnabled ? 'On' : 'Off';
        document.getElementById('vibeStatus').innerText = vibeEnabled ? 'On' : 'Off';


        // Prayer Tracker Generation (30 Days with Reset Option)
        const prayerBody = document.getElementById('prayerTableBody');
        let prayersData = JSON.parse(localStorage.getItem('prayer_tracker')) || {};

        function renderPrayerTable() {
            prayerBody.innerHTML = '';
            for (let day = 1; day <= 30; day++) {
                let tr = document.createElement('tr');
                let prayers = ['fajr', 'duhr', 'asr', 'magh', 'isha'];
                
                let html = `<td><b>${day}</b></td>`;
                prayers.forEach(p => {
                    let isChecked = prayersData[`day_${day}_${p}`] ? 'checked' : '';
                    html += `<td><input type="checkbox" class="prayer-checkbox" ${isChecked} onchange="savePrayer(${day}, '${p}', this.checked)"></td>`;
                });
                tr.innerHTML = html;
                prayerBody.appendChild(tr);
            }
        }
        renderPrayerTable();

        function savePrayer(day, prayer, status) {
            prayersData[`day_${day}_${prayer}`] = status;
            localStorage.setItem('prayer_tracker', JSON.stringify(prayersData));
            triggerFeedback();
        }

        function resetPrayerTracker() {
            if (confirm("Are you sure you want to reset all 30 days prayer tracker?")) {
                prayersData = {};
                localStorage.removeItem('prayer_tracker');
                renderPrayerTable();
            }
        }


        // Duas Data
        const duas = [
            { num: 1, title: "Before Sleeping", ar: "باسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيا", meaning: "In Your name, O Allah, I die and I live.", source: "Sahih al-Bukhari 6324" },
            { num: 2, title: "After Waking Up", ar: "الحَمْدُ للهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", meaning: "All praise is for Allah, who gave us life after causing us to die, and to Him is the resurrection.", source: "Sahih al-Bukhari 6312" },
            { num: 3, title: "Before Eating", ar: "بِسْمِ اللَّهِ", meaning: "In the name of Allah.", source: "Sunan Abi Dawud 3767; Jami` at-Tirmidhi 1859" },
            { num: 4, title: "If You Forgot to Say Bismillah", ar: "بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ", meaning: "In the name of Allah at its beginning and at its end.", source: "Sunan Abi Dawud 3767" },
            { num: 5, title: "After Eating", ar: "الحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ", meaning: "All praise is for Allah, who fed me this and provided it for me without any power or strength from me.", source: "Jami` at-Tirmidhi 3458" },
            { num: 6, title: "Leaving Home", ar: "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ", meaning: "In the name of Allah. I place my trust in Allah. There is no power and no strength except through Allah.", source: "Sunan Abi Dawud 5095" },
            { num: 7, title: "Entering Home", ar: "بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا", meaning: "In the name of Allah we enter, and in the name of Allah we leave, and upon our Lord Allah we rely.", source: "Sunan Abi Dawud 5096" },
            { num: 8, title: "Before Entering Toilet", ar: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", meaning: "O Allah, I seek refuge in You from male and female devils.", source: "Sahih al-Bukhari 142" },
            { num: 9, title: "After Leaving Toilet", ar: "غُفْرَانَكَ", meaning: "I seek Your forgiveness.", source: "Sunan Abi Dawud 30" }
        ];

        const duaContainer = document.getElementById('duaListContainer');
        duas.forEach((d) => {
            duaContainer.innerHTML += `
                <div class="content-box">
                    <div style="font-size:12px; color:#38bdf8; font-weight:bold; margin-bottom:4px;">${d.num}. ${d.title}</div>
                    <div class="arabic-text">${d.ar}</div>
                    <div class="english-meaning">"${d.meaning}"</div>
                    <div class="source-text">Source: ${d.source}</div>
                </div>
            `;
        });

        // Daily Deeds Data
        const deeds = [
            { icon: "🤝", title: "Help Someone", desc: "Try to help someone today." },
