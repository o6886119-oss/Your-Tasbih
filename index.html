<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tasbih App - Liquid Glass</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent; /* Removes the tap blue/gray box overlay */
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
            overflow: hidden;
        }
        #appContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            box-sizing: border-box;
            padding: 20px;
        }

        /* Dropdown Selectors Area - High Liquid Glass */
        .selector-box {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            padding: 12px 15px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.4);
            border: 1px solid rgba(255, 255, 255, 0.35);
            margin-top: 10px;
        }
        .selector-box select {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            width: 100%;
            border-radius: 14px;
            outline: none;
            cursor: pointer;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-family: 'Traditional Arabic', Arial, sans-serif;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
        }
        .selector-box select option {
            background: #134e5e;
            color: #ffffff;
        }
        .arabic-sub {
            font-size: 19px;
            color: #ffffff;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            padding: 0 15px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: 'Traditional Arabic', Arial, sans-serif;
        }

        /* Top Action Icons Bar */
        .action-bar {
            display: flex;
            gap: 25px;
            margin-top: 20px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: 0.1s;
        }
        .icon-btn:active {
            transform: scale(0.90);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Main Counter Circle Area with Pure Liquid Glass */
        .counter-section {
            position: relative;
            margin-top: 35px;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), inset 0 5px 15px rgba(255,255,255,0.3);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .counter-section:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
        }
        .ring-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
        }
        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 12;
        }
        .ring-progress {
            fill: none;
            stroke: url(#liquidGradient);
            stroke-width: 15;
            stroke-dasharray: 722;
            stroke-dashoffset: 722;
            transition: stroke-dashoffset 0.25s ease;
            stroke-linecap: round;
        }
        .counter-display {
            z-index: 2;
            font-size: 65px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        /* Total Box (Sorbomoto) with Liquid Glass */
        .total-container {
            position: absolute;
            bottom: 50px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .total-circle {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .total-box-label {
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="appContainer">
        <!-- Zikr Dropdown & Target Dropdown -->
        <div class="selector-box">
            <select id="zikrSelect" onchange="updateZikrText()">
                <option value="أَسْتَغْفِرُ اللَّهَ">أَسْتَغْفِرُ اللَّهَ</option>
                <option value="سُبْحَانَ اللَّهِ">سُبْحَانَ اللَّهِ</option>
                <option value="اللَّهُ أَكْبَرُ">اللَّهُ أَكْبَرُ</option>
                <option value="لَا إِلَهَ إِلَّا اللَّهُ">لَا إِلَهَ إِلَّا اللَّهُ</option>
                <option value="لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ">لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ</option>
                <option value="حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ">حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ</option>
                <option value="صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ">صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ</option>
                <option value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ</option>
                <option value="سُبْحَانَ اللَّهِ وَبِحَمْدِهِ">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</option>
                <option value="لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ">لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ</option>
                <option value="اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ</option>
            </select>

            <select id="targetSelect" onchange="changeTarget()">
                <option value="11">Target: 11</option>
                <option value="33">Target: 33</option>
                <option value="100" selected>Target: 100</option>
                <option value="custom">Custom Target</option>
            </select>
        </div>

        <div class="arabic-sub" id="zikrMeaning">أَسْتَغْفِرُ اللَّهَ</div>

        <!-- Action Icons -->
        <div class="action-bar">
            <div class="icon-btn" onclick="openSettings()" title="Settings">⚙️</div>
            <div class="icon-btn" onclick="resetCounter()" title="Reset">🔄</div>
            <div class="icon-btn" onclick="toggleSound()" title="Sound">🔊</div>
        </div>

        <!-- Main Clickable Ring Counter -->
        <div class="counter-section" onclick="incrementCount()">
            <svg class="ring-svg" viewBox="0 0 260 260">
                <defs>
                    <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="50%" stop-color="#7dd3fc" />
                        <stop offset="100%" stop-color="#0284c7" />
                    </linearGradient>
                </defs>
                <circle class="ring-bg" cx="130" cy="130" r="110"></circle>
                <circle id="progressRing" class="ring-progress" cx="130" cy="130" r="110"></circle>
            </svg>
            <div class="counter-display" id="currentCount">0</div>
        </div>

        <!-- Sorbomoto (Total Counter) Box -->
        <div class="total-container">
            <div class="total-circle" id="totalCountDisplay">0</div>
            <div class="total-box-label">সর্বমোট: <span id="totalTextNum">0</span></div>
        </div>
    </div>

    <script>
        let currentCount = 0;
        let totalCount = 0;
        let targetLimit = 100;
        let soundEnabled = true;

        const currentCountElem = document.getElementById('currentCount');
        const totalCountDisplay = document.getElementById('totalCountDisplay');
        const totalTextNum = document.getElementById('totalTextNum');
        const progressRing = document.getElementById('progressRing');
        const targetSelect = document.getElementById('targetSelect');
        const zikrSelect = document.getElementById('zikrSelect');
        const zikrMeaning = document.getElementById('zikrMeaning');

        const radius = 110;
        const circumference = 2 * Math.PI * radius;
        progressRing.style.strokeDasharray = circumference;

        function updateDisplay() {
            currentCountElem.innerText = currentCount;
            totalCountDisplay.innerText = totalCount;
            totalTextNum.innerText = totalCount;

            let progress = currentCount / targetLimit;
            if (progress > 1) progress = 1;
            let offset = circumference - (progress * circumference);
            progressRing.style.strokeDashoffset = offset;
        }

        function incrementCount() {
            currentCount++;
            totalCount++;
            playSound();

            if (currentCount >= targetLimit) {
                currentCount = 0; 
            }
            updateDisplay();
        }

        function resetCounter() {
            if (confirm("Apni ki current count ebong sorbomoto duitai reset korte chan?")) {
                currentCount = 0;
                totalCount = 0;
                updateDisplay();
            }
        }

        function changeTarget() {
            let val = targetSelect.value;
            if (val === 'custom') {
                let customVal = prompt("Enter custom target number:", "50");
                if (customVal && !isNaN(customVal)) {
                    targetLimit = parseInt(customVal);
                } else {
                    targetLimit = 100;
                    targetSelect.value = "100";
                }
            } else {
                targetLimit = parseInt(val);
            }
            currentCount = 0;
            updateDisplay();
        }

        function updateZikrText() {
            zikrMeaning.innerText = zikrSelect.value;
            currentCount = 0;
            updateDisplay();
        }

        function playSound() {
            if (!soundEnabled) return;
            if (navigator.vibrate) {
                navigator.vibrate(40);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            alert(soundEnabled ? "Sound & Vibration Enabled" : "Sound & Vibration Disabled");
        }

        function openSettings() {
            let action = prompt("Type 'resetall' to clear counts.");
            if (action === 'resetall') {
                totalCount = 0;
                currentCount = 0;
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
